name: APK Universal (Android)

# Compila el APK universal (armeabi-v7a + arm64-v8a) y lo publica en un Release.
#   · Automático: al subir una etiqueta  →  git tag v4.1.0 && git push origin v4.1.0
#   · Manual:     pestaña Actions → "APK Universal (Android)" → Run workflow
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta del release (vacío = v<versión>-build<N>)'
        required: false
        default: ''
      prerelease:
        description: 'Marcar como pre-lanzamiento'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Compilar APK universal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (ya viene en el runner, solo licencias y plataforma 34)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)
          echo "sdkmanager: ${SDKM:-no encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Versión y etiqueta
        run: |
          VERSION=$(grep -oP "const VERSION = '\K[^']+" js/config.js)
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Versión $VERSION · etiqueta $TAG · versionCode $GITHUB_RUN_NUMBER"

      - name: Instalar dependencias (Capacitor, esbuild)
        run: npm install --no-audit --no-fund

      - name: Preparar la web (www/) y bajar la sintaxis para Android 9
        run: node scripts/prepare-web.mjs

      - name: Crear el proyecto Android (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "Usando la clave de los Secrets (las actualizaciones se instalan encima de la versión anterior)."
          else
            KS_PASS="fnfgamercb"; KEY_PASS="fnfgamercb"; KEY_ALIAS="gamercb"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FNF GamerCB, O=GamerCB, C=CL"
            echo "::warning::Sin Secrets de firma: se generó una clave nueva. Para actualizar sin desinstalar, crea los Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD (ver README)."
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Parchear el proyecto (pantalla completa, ABIs, firma, iconos)
        run: node scripts/patch-android.mjs

      - name: Compilar el APK (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Preparar los archivos del release
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::Gradle no generó ningún APK"; exit 1; }
          OUT="dist/FNF-GamerCB-${TAG}-universal.apk"
          cp "$APK" "$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --verbose "$OUT" | head -n 6 || true
          "$BT/aapt" dump badging "$OUT" | grep -E "^package|sdkVersion|native-code" || true
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          SIZE=$(du -h "$OUT" | cut -f1)
          cat > dist/RELEASE_NOTES.md <<EOF
          ## FNF GamerCB ${VERSION}

          **APK universal** (${SIZE}): un solo archivo para **armeabi-v7a** (32 bits) y **arm64-v8a** (64 bits).

          - Android 5.1 o superior (probado el diseño para Android 9+ con pantalla completa inmersiva y notch).
          - Si ya tenías otra versión instalada con una clave de firma distinta, desinstálala antes de instalar esta.
          - Los mods se cargan desde su archivo **.zip** (Pausa → Chart y modo → Motor → .zip del mod).
          EOF

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FNF-GamerCB-${{ env.TAG }}-universal
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar el Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FNF GamerCB ${{ env.TAG }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
